# BK7252 (ARM968E-S). Addresses: docs/memory_map.md.

name = "BK7252"

# Instructions executed per microsecond of device time.
insns_per_us = 100

# [base, size]: accesses no module claims are logged and read as 0.
peripheral_window = [0x00800000, 0x00100000]

# reset_fill: the byte the region holds after a chip reset (watchdog expiry).
# Without it the contents survive the reset.
# executable = false: a fetch from the region is a Prefetch Abort (RAM1 cannot run code).
[[memory]]
name = "RAM1"
base = 0x00400000
size = 0x40000
reset_fill = 0xAA
executable = false

[[memory]]
name = "RAM2"
base = 0x00900000
size = 0x40000
reset_fill = 0xAA

# Names usable in --load. A plain number is a bus address; a table points
# into a module (flash offsets are raw physical, CRC bytes included).
[alias]
RAM = 0x00400000
IRAM = 0x00900000

[alias.bootloader]
module = "FLASH"
offset = 0x00000000

[alias.app]
module = "FLASH"
offset = 0x00011000

[[module]]
type = "flash"
name = "FLASH"
[module.bases]
xip = 0x00000000
ctrl = 0x00803000
[module.params]
size = 0x200000

# "irq" is a bit number of the ICU's irq_enable register (soc/icu.h).
# Values below are the register state at bootloader entry, docs/por_reset_state.md.
[[module]]
type = "sctrl"
name = "SCTRL"
[module.bases]
regs = 0x00800000
[module.params]
chip_id = 0x0007221a
device_id = 0x18221020
# Emulation hack: the firmware's busy-wait loops count iterations from the MCLK divider
# (control[7:4], clock = source / (divider + 1)) and run several times slower here than
# on the chip. Reading the divider one higher makes them count fewer iterations.
read_adjust = [{ offset = 0x008, shift = 4, width = 4, add = 1 }]
[module.params.reset_words]
"0x008" = 0x00020000  # control: DCO main clock, qspi_io_volt = 2
"0x00c" = 0x000001ff  # clk_gating
"0x010" = 0x00000028  # reset: tl410_boot, tl410_ext_wait
"0x01c" = 0x00000207  # flash_delay
"0x040" = 0x3c000000  # analog_spi: idle, freq_div = 60
"0x058" = 0x61105b57  # analog_ctrl0..6: calibration preloaded by the vendor ROM
"0x05c" = 0x68c03102
"0x060" = 0x84036080
"0x064" = 0x180004a0
"0x068" = 0x84200a52
"0x06c" = 0x3b13b13b
"0x070" = 0x00b09350
"0x084" = 0xffe08410  # charge_status after a cold power-on
"0x104" = 0x00a60000  # sleep
"0x108" = 0x00000040  # digital_vdd
"0x118" = 0x0000001f  # pmu_status: USB, DSP, modem, MAC powered down
"0x12c" = 0x00000147  # block_enable
"0x134" = 0x00000030  # rosc_cal
[module.params.warm_reset_words]
"0x084" = 0xffe08010  # charge_status after a watchdog reset
# Register fields other modules watch. power_mac_modem: the upper half is the MAC key
# (MAC_PWU = 1 wakes it, MAC_PWD = 0xD802 powers it down).
[module.params.signals]
mac_powered = { offset = 0x10c, shift = 16, width = 16, equals = 1 }

[[module]]
type = "intc"
name = "ICU"
[module.bases]
regs = 0x00802000
[module.params]
# peri_clk_pwd (+0x08) powers every peripheral clock down at reset (docs/por_reset_state.md).
reset_words = { "0x08" = 0x00ffffff }
# Register bits other modules watch: [offset, bit]. 1 = clock powered down.
signals = { arm_wdt_pwd = [0x08, 8] }

[[module]]
type = "wdt"
name = "WDT"
[module.bases]
regs = 0x00802900
[module.params]
clock_off_signal = "ICU.arm_wdt_pwd"

# WiFi blocks (src/platform/soc/include/rwnx): plain registers for now, except the MAC
# core's monotonic counters, which run while the MAC is powered.
[[module]]
type = "wifi_mdm_stat"
name = "MDM_STAT"
[module.bases]
regs = 0x01000000

[[module]]
type = "wifi_mdm_cfg"
name = "MDM_CFG"
[module.bases]
regs = 0x01000800

[[module]]
type = "wifi_agc"
name = "AGC"
[module.bases]
regs = 0x01002000

[[module]]
type = "wifi_rc"
name = "RC"
[module.bases]
regs = 0x01050000

[[module]]
type = "wifi_nx_intc"
name = "NX_INTC"
[module.bases]
regs = 0x10910000

[[module]]
type = "wifi_nx_dma"
name = "NX_DMA"
[module.bases]
regs = 0x10a00000

[[module]]
type = "wifi_la"
name = "LA"
[module.bases]
regs = 0x10e00000

[[module]]
type = "wifi_mac_core"
name = "MAC_CORE"
[module.bases]
regs = 0xc0000000
[module.params]
mac_powered_signal = "SCTRL.mac_powered"

[[module]]
type = "wifi_mac_pl"
name = "MAC_PL"
[module.bases]
regs = 0xc0008000

[[module]]
type = "wifi_mac_pta"
name = "MAC_PTA"
[module.bases]
regs = 0xc0010000

# bus_hz: the clock the transfer times in docs/hardware/dma.md were measured at.
[[module]]
type = "gdma"
name = "GDMA"
[module.bases]
regs = 0x00809000
[module.params]
intc = "ICU"
irq = 15
bus_hz = 120000000

# Pin words read 0x28 at reset (output driver off, pull-down); GPIO 20-23 also have
# function_enable set by the vendor ROM (docs/por_reset_state.md).
[[module]]
type = "gpio"
name = "GPIO"
[module.bases]
regs = 0x00802800
[module.params]
intc = "ICU"
irq = 7
pin_reset = 0x28
[module.params.reset_words]
"0x050" = 0x68  # GPIO20
"0x054" = 0x68  # GPIO21
"0x058" = 0x68  # GPIO22
"0x05c" = 0x68  # GPIO23
"0x09c" = 0x02  # detect: is_usb_plug_in
"0x0b8" = 0x5500  # func_mux_2: GPIO 20-23 in peripheral mode 2

[[module]]
type = "timer"
name = "TIMER0"
[module.bases]
regs = 0x00802A00
[module.params]
intc = "ICU"
irq = 8
hz = 26000000

[[module]]
type = "timer"
name = "TIMER1"
[module.bases]
regs = 0x00802A40
[module.params]
intc = "ICU"
irq = 8
hz = 32000

[[module]]
type = "uart"
name = "UART1"
[module.bases]
regs = 0x00802100
[module.params]
intc = "ICU"
irq = 0

[[module]]
type = "uart"
name = "UART2"
[module.bases]
regs = 0x00802200
[module.params]
intc = "ICU"
irq = 1
